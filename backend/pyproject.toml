[project]
name = "gymai-backend"
version = "0.1.0"
description = "Gym&I authoritative session + coaching server (Tyler)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jsonschema>=4.23", "httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
audio = ["elevenlabs>=1.0"]
dynamic-cues = ["elevenlabs>=1.0", "google-genai>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gymai_backend"]
